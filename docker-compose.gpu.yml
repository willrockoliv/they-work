# Override opcional para hospedar a inferência na GPU NVIDIA.
# Requer o NVIDIA Container Toolkit instalado no host.
# Uso: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    environment:
      # A GPU Pascal (compute 6.1) falha com a biblioteca cuda_v13 do Ollama 0.12.11.
      OLLAMA_LLM_LIBRARY: cuda_v12
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Sem acesso ao driver, o nvidia-smi não enxerga a VRAM e a Natureza monitora apenas RAM.
  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [utility]
