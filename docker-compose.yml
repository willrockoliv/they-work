name: theywork

# Redes:
#   edge      -> única com exposição ao host (apenas o backend publica porta)
#   core      -> isolada (internal), sem rota para a internet: Postgres e Redis
#   inference -> saída de rede necessária apenas para `ollama pull`
networks:
  edge:
    driver: bridge
  core:
    driver: bridge
    internal: true
  inference:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_models:

services:
  postgres:
    image: postgres:16.11-alpine
    container_name: theywork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-theywork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-theywork}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - core
      - edge
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-theywork} -d ${POSTGRES_DB:-theywork}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.2.2-alpine
    container_name: theywork-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    networks:
      - core
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.12.11
    container_name: theywork-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # A Natureza exige um único modelo residente por vez (16 GB de RAM / 4 GB de VRAM).
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    networks:
      - inference
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: theywork-backend:0.1.0
    container_name: theywork-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-theywork}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-theywork}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - edge
      - core
      - inference
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: theywork-frontend:0.1.0
    container_name: theywork-frontend
    restart: unless-stopped
    environment:
      # Mesma origem: o dev server do Vite faz proxy de `/api` e `/ws` para o backend.
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_started
