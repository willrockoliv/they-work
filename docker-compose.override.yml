# Override de desenvolvimento (carregado automaticamente pelo `docker compose`).
# Monta o código do host no container e habilita hot-reload do uvicorn.
services:
  backend:
    volumes:
      - ./backend:/app/backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/backend/app

  frontend:
    volumes:
      # `node_modules` fica num volume anônimo: o host não precisa (nem deve) tê-lo.
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: ["npm", "run", "dev"]
